
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobPortal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fa;
            color: #243247;
        }

        header {
            background: #142b49;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #35c6b0;
        }

        .logout {
            background: #35c6b0;
            color: #142b49;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 40px 7%;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin-bottom: 10px;
        }

        .welcome p {
            color: #66758a;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-bottom: 12px;
            color: #142b49;
        }

        .card p {
            color: #66758a;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card button {
            background: #142b49;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .card button:hover {
            background: #35a995;
        }
    </style>
</head>

<body>

    <header>
        <h2>JobPortal</h2>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">

        <div class="welcome">
            <h1 id="welcomeMessage">Welcome!</h1>
            <p>Find opportunities and take the next step in your career.</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Browse Jobs</h3>
                <p>Explore available job opportunities and find a suitable position.</p>
                <button onclick="window.location.href='index.html'">
                    Explore Jobs
                </button>
            </div>

            <div class="card">
                <h3>My Applications</h3>
                <p>Keep track of the jobs you have applied for.</p>
                <button onclick="window.location.href='my-applications.html'">
    View Applications
</button>
            </div>

            <div class="card">
                <h3>My Profile</h3>
                <p>View and manage your personal account information.</p>
                <button onclick="window.location.href='profile.html'">
    View Profile
</button>
            </div>

        </div>
    </div>

    <script>
        const userName = localStorage.getItem("userName");

        if (!userName) {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcomeMessage").textContent =
                "Welcome, " + userName + "!";
        }

        function logout() {
    localStorage.removeItem("userName");
    localStorage.removeItem("userId");
    window.location.href = "login.html";
}
    </script>

</body>
</html>
